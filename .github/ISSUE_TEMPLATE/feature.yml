name: Feature
description: A capability Lots should have.
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who needs this and why. What do they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. Mention policy, identity and audit if the feature lets the agent do something new.
  - type: checkboxes
    id: principles
    attributes:
      label: Principles
      options:
        - label: Policy stays outside the model, and nothing becomes callable without a declared tool and a role (see CLAUDE.md).
