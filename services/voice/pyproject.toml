[project]
name = "lots-voice"
version = "0.1.0"
description = "Lots voice service: speech to text and text to speech (Swedish, English) behind an OpenAI-shaped API"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Real engines. Kept optional so the API layer can be tested without a GPU or models.
engines = [
    "faster-whisper>=1.1",        # MIT
    "sherpa-onnx>=1.12",          # Apache-2.0 (runs Piper VITS voices)
    "nvidia-cublas-cu12",         # CUDA libraries for CTranslate2 on the GPU
    "nvidia-cudnn-cu12",
]
# The expressive voice (Chatterbox Multilingual, MIT). Heavy: PyTorch with CUDA.
# chatterbox-tts pins vulnerable transformers/diffusers and pulls in gradio and pykakasi (#147), so the Dockerfile installs it with
# --no-deps and these are its dependencies, at fixed versions (verified with evals/voice).
chatterbox = [
    "torch==2.6.0", "torchaudio==2.6.0", "numpy<2", "librosa==0.11.0", "s3tokenizer", "conformer==0.3.2", "resemble-perth>=1.0.0",
    "spacy-pkuseg", "pyloudnorm", "omegaconf", "safetensors>=0.8", "transformers>=5.10,<5.11", "diffusers>=0.38,<0.39",
]
# Trace export (#139); the API alone is enough to adopt the caller's trace context.
telemetry = ["opentelemetry-sdk==1.45.1", "opentelemetry-exporter-otlp-proto-http==1.45.1"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["voice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
