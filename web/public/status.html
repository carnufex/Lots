<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lots status</title>
  <style>
    :root { --bg: #0f1115; --text: #e6e8eb; --muted: #8b93a1; --ok: #34d399; --warn: #fbbf24; --down: #f87171; }
    @media (prefers-color-scheme: light) { :root { --bg: #f7f8fa; --text: #15181d; --muted: #5b6472; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; display: grid; place-items: start center; }
    main { width: min(560px, calc(100% - 32px)); padding: 48px 0; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .overall { font-size: 28px; font-weight: 600; margin: 8px 0 24px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #ffffff14; }
    .operational { color: var(--ok); } .degraded { color: var(--warn); } .down, .unknown { color: var(--down); }
    small { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Lots status</h1>
    <div class="overall" id="overall">Checking…</div>
    <ul id="components"></ul>
    <p><small id="checked"></small></p>
  </main>
  <script src="/status.js"></script>
</body>
</html>
