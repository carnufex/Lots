<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lots status</title>
  <style>
    :root { --bg: #0f1115; --text: #e6e8eb; --muted: #8b93a1; --ok: #34d399; --warn: #fbbf24; --down: #f87171; }
    @media (prefers-color-scheme: light) { :root { --bg: #f7f8fa; --text: #15181d; --muted: #5b6472; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; display: grid; place-items: start center; }
    main { width: min(560px, calc(100% - 32px)); padding: 48px 0; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .overall { font-size: 28px; font-weight: 600; margin: 8px 0 24px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #ffffff14; }
    .operational { color: var(--ok); } .degraded { color: var(--warn); } .down, .unknown { color: var(--down); }
    small { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Lots status</h1>
    <div class="overall" id="overall">Checking…</div>
    <ul id="components"></ul>
    <p><small id="checked"></small></p>
  </main>
  <script>
    // Public status (#83): coarse components only, no internal names or errors. Refreshes every 30 s.
    async function load() {
      try {
        const s = await (await fetch('/status', { cache: 'no-store' })).json()
        const label = { operational: 'All systems operational', degraded: 'Some features are degraded', down: 'Service disruption', unknown: 'Status unknown' }
        const o = document.getElementById('overall')
        o.textContent = label[s.overall] || s.overall
        o.className = 'overall ' + s.overall
        const ul = document.getElementById('components')
        ul.replaceChildren(...s.components.map(c => {
          const li = document.createElement('li')
          const name = document.createElement('span'); name.textContent = c.name
          const state = document.createElement('span'); state.textContent = c.state; state.className = c.state
          li.append(name, state)
          return li
        }))
        document.getElementById('checked').textContent = s.checkedAt ? 'Checked ' + new Date(s.checkedAt).toLocaleString() : ''
      } catch {
        document.getElementById('overall').textContent = 'Status unavailable'
      }
    }
    load()
    setInterval(load, 30000)
  </script>
</body>
</html>
