# Prometheus for the default observability stack (#140): scrapes the shell's /metrics (OpenMetrics, with exemplars that link to
# traces) and evaluates the alert rules next to it.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: lots-shell
    scrape_protocols: [OpenMetricsText1.0.0, PrometheusText0.0.4]
    static_configs:
      - targets: ["shell:8080"]
