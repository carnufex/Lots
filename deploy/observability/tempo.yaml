# Tempo, single binary with local storage: for a laptop or a small installation (#140).
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
storage:
  trace:
    backend: local
    local: { path: /var/tempo/traces }
    wal: { path: /var/tempo/wal }
compactor:
  compaction:
    block_retention: 168h   # a week of traces
