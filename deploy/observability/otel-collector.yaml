# OpenTelemetry Collector for the default observability stack (#140). Traces go to Tempo, logs to Loki; metrics are scraped from
# /metrics by Prometheus directly, so they do not pass through here.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch: {}
  # Keep every trace worth looking at; sample the rest.
  tail_sampling:
    decision_wait: 10s
    policies:
      - name: errors
        type: status_code
        status_code: { status_codes: [ERROR] }
      - name: policy-denied-or-approval
        type: string_attribute
        string_attribute: { key: lots.policy.decision, values: [Deny, RequireApproval] }
      - name: slow
        type: latency
        latency: { threshold_ms: 10000 }
      - name: everything-else
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:LOTS_TRACE_SAMPLE_PERCENT}   # block style: the braces of ${...} would end a { } mapping

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
