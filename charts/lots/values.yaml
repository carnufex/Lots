# Lots shell. Works on plain Kubernetes and on OpenShift (restricted SCC): non-root with an arbitrary UID,
# no host mounts, no privileged ports, read-only root filesystem, all capabilities dropped.

image:
  repository: ghcr.io/carnufex/lots-shell
  tag: ""            # defaults to the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Replicas are safe: every replica runs a worker, and a run is executed by whoever holds its lease.
replicaCount: 1

auth:
  mode: Oidc          # Oidc | Dev. Dev authenticates everyone as one user: local development only.
  oidc:
    authority: ""     # required for Oidc, e.g. https://authentik.example.com/application/o/lots/
    clientId: lots
    audience: ""
    userClaim: sub
    roleClaim: roles
    rolePrefix: ""     # e.g. "lots-" when the IdP's group claim is the role claim: group lots-admin = role admin
  adminRoles: admin
  auditRoles: "admin,auditor"

database:
  # PostgreSQL is external. The Secret must contain the Npgsql connection string.
  existingSecret: ""
  connectionStringKey: connection-string
  migrateOnStartup: true

model:
  baseUrl: ""         # OpenAI-compatible endpoint, e.g. http://ollama:11434/v1
  name: ""
  apiKey:
    existingSecret: ""
    key: api-key
  # Embedding model on the same endpoint (knowledge, ADR 0016), e.g. nomic-embed-text or bge-m3. Empty: knowledge search is off.
  embedModel: ""

# Knowledge sources of kind "directory" read files under /knowledge. Mount a PVC there (synced from Git by your own job/sidecar).
# Sources themselves are config as code: Knowledge__Sources__0__Id etc. through extraEnv, or created on the Knowledge page.
knowledge:
  existingClaim: ""

# GitOps (#68): a git-sync sidecar keeps a checkout of your configuration repository; the shell applies every YAML file under
# `path` as gitops-managed (read-only in the UI) and prunes what was removed. Alternatively run `lotsctl apply` from your CD.
gitops:
  enabled: false
  repo: ""                 # e.g. https://git.example.com/ops/lots-config.git
  ref: main
  path: ""                 # sub-directory with the resources ("" = repository root)
  period: 60s
  prune: true
  credentialsSecret: ""    # optional Secret with GITSYNC_USERNAME / GITSYNC_PASSWORD (HTTPS)
  image: registry.k8s.io/git-sync/git-sync:v4.4.2

# Plain extra environment variables (non-secret configuration such as Models__Aliases__voice__..., Knowledge__Sources__...).
extraEnv: []
#  - name: Models__Aliases__voice__Targets__0__Endpoint
#    value: default

# Profiles. Empty: use the profiles baked into the image. Otherwise: file name -> YAML manifest, mounted as a ConfigMap.
profiles:
  files: {}
  defaultProfile: ""

# Extra environment variables sourced from Secrets, e.g. the password a profile references via passwordEnv.
extraSecretEnv: []
#  - name: CMDB_AGENT_TOKEN
#    secretName: cmdb-agent
#    key: token

# Persistent Data Protection keys (needed for delegated identity, ADR 0011: stored login tokens are encrypted with them).
# Use a PVC shared by all replicas. Empty: keys are ephemeral and delegated calls fail closed after a restart.
dataProtection:
  existingClaim: ""

# Optional OTLP endpoint for GenAI traces.
otlpEndpoint: ""

service:
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: lots.example.com
  tls:
    secretName: ""

# OpenShift: expose with a Route instead of an Ingress.
route:
  enabled: false
  host: ""
  tlsTermination: edge

# Homelab MCP server. It needs Docker access through a READ-ONLY socket proxy that you provide (no host
# mounts in this chart), so it is off by default.
mcpHomelab:
  enabled: false
  image:
    repository: ghcr.io/carnufex/lots-mcp-homelab
    tag: ""
  dockerUrl: http://docker-proxy:2375

# Tool packs (#63/#64): fetch, files, SQL, OpenAPI, Kubernetes, monitoring, Git. Each pack is off unless configured in env.
mcpToolpack:
  enabled: false
  image:
    repository: ghcr.io/carnufex/lots-mcp-toolpack
    tag: ""
  kubernetesReadOnly: false   # creates a ServiceAccount with a read-only ClusterRole (no secrets) and enables the kubernetes pack
  filesClaim: ""              # PVC mounted read-only at /files (set env Files__Root: /files)
  env: {}
  #  Prometheus__Url: http://kube-prometheus-stack-prometheus.monitoring:9090
  #  Alertmanager__Url: http://kube-prometheus-stack-alertmanager.monitoring:9093
  #  Git__Repos__0: my-org/*
  #  Fetch__AllowedHosts__0: docs.example.com
  secretEnv: []
  #  - { name: GIT_TOKEN, secretName: lots-git, key: token }   # then env Git__TokenRef: GIT_TOKEN

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 512Mi }

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
