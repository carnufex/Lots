{{- if and (eq (lower .Values.auth.mode) "oidc") (not .Values.auth.oidc.authority) }}
{{- fail "auth.oidc.authority is required when auth.mode is Oidc" }}
{{- end }}
{{- if not .Values.database.existingSecret }}
{{- fail "database.existingSecret is required (a Secret holding the PostgreSQL connection string)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lots.name" . }}
  labels: {{- include "lots.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate   # safe: runs are leased, so replicas never execute the same run
  selector:
    matchLabels: {{- include "lots.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "lots.selector" . | nindent 8 }}
      annotations:
        {{- if .Values.profiles.files }}
        checksum/profiles: {{ toYaml .Values.profiles.files | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext: {{- include "lots.podSecurityContext" . | nindent 8 }}
      containers:
        - name: shell
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "lots.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - { name: HOME, value: /tmp }
            - { name: Auth__Mode, value: {{ .Values.auth.mode | quote }} }
            - { name: Auth__Oidc__Authority, value: {{ .Values.auth.oidc.authority | quote }} }
            - { name: Auth__Oidc__ClientId, value: {{ .Values.auth.oidc.clientId | quote }} }
            - { name: Auth__Oidc__Audience, value: {{ .Values.auth.oidc.audience | quote }} }
            - { name: Auth__Oidc__UserClaim, value: {{ .Values.auth.oidc.userClaim | quote }} }
            - { name: Auth__Oidc__RoleClaim, value: {{ .Values.auth.oidc.roleClaim | quote }} }
            - { name: Auth__Oidc__RolePrefix, value: {{ .Values.auth.oidc.rolePrefix | quote }} }
            - { name: Auth__AdminRoles, value: {{ .Values.auth.adminRoles | quote }} }
            - { name: Auth__AuditRoles, value: {{ .Values.auth.auditRoles | quote }} }
            - { name: Egress__Default__AllowPrivateNetworks, value: {{ .Values.egress.allowPrivateNetworks | quote }} }
            {{- range $i, $h := .Values.egress.allowedHosts }}
            - { name: Egress__Default__AllowedHosts__{{ $i }}, value: {{ $h | quote }} }
            {{- end }}
            {{- range $i, $h := .Values.egress.webhookHosts }}
            - { name: Egress__Webhook__AllowedHosts__{{ $i }}, value: {{ $h | quote }} }
            {{- end }}
            - { name: Database__MigrateOnStartup, value: {{ .Values.database.migrateOnStartup | quote }} }
            - { name: Model__BaseUrl, value: {{ .Values.model.baseUrl | quote }} }
            - { name: Model__Model, value: {{ .Values.model.name | quote }} }
            {{- if .Values.model.embedModel }}
            - { name: Models__Aliases__embed__Targets__0__Endpoint, value: default }
            - { name: Models__Aliases__embed__Targets__0__Model, value: {{ .Values.model.embedModel | quote }} }
            {{- end }}
            {{- if .Values.gitops.enabled }}
            - { name: GitOps__Path, value: {{ printf "/git/current/%s" .Values.gitops.path | trimSuffix "/" | quote }} }
            - { name: GitOps__Prune, value: {{ .Values.gitops.prune | quote }} }
            {{- end }}
            {{- if or .Values.voice.enabled .Values.voice.url }}
            {{- $v := .Values.voice }}
            - { name: Speech__BaseUrl, value: {{ ternary (printf "http://%s-voice:8700/v1" (include "lots.name" .)) $v.url $v.enabled | quote }} }
            - { name: Speech__DefaultLanguage, value: {{ $v.defaultLanguage | quote }} }
            - { name: Speech__Voices__sv, value: {{ $v.voices.sv | quote }} }
            - { name: Speech__Voices__en, value: {{ $v.voices.en | quote }} }
            {{- with $v.vocabulary }}
            - { name: Speech__Vocabulary, value: {{ . | quote }} }
            {{- end }}
            {{- if $v.apiKey.existingSecret }}
            - { name: Speech__ApiKeyEnv, value: LOTS_VOICE_KEY }
            - name: LOTS_VOICE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $v.apiKey.existingSecret }}
                  key: {{ $v.apiKey.key }}
            {{- end }}
            {{- end }}
            {{- if .Values.audio.existingClaim }}
            - { name: Speech__AudioPath, value: /data/audio }
            - { name: Speech__AudioRetentionDays, value: {{ .Values.audio.retentionDays | quote }} }
            {{- end }}
            {{- range .Values.extraEnv }}
            - { name: {{ .name }}, value: {{ .value | quote }} }
            {{- end }}
            {{- if .Values.profiles.files }}
            - { name: Profiles__Path, value: /profiles }
            {{- end }}
            {{- if .Values.dataProtection.existingClaim }}
            - { name: DataProtection__KeysPath, value: /keys }
            {{- end }}
            {{- if .Values.profiles.defaultProfile }}
            - { name: Agent__DefaultProfile, value: {{ .Values.profiles.defaultProfile | quote }} }
            {{- end }}
            {{- if .Values.otlpEndpoint }}
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.otlpEndpoint | quote }} }
            {{- end }}
            - name: ConnectionStrings__Lots
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.connectionStringKey }}
            {{- if .Values.model.apiKey.existingSecret }}
            - { name: Model__ApiKeyEnv, value: LOTS_MODEL_API_KEY }
            - name: LOTS_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.model.apiKey.existingSecret }}
                  key: {{ .Values.model.apiKey.key }}
            {{- end }}
            {{- range .Values.extraSecretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .key }}
            {{- end }}
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.profiles.files }}
            - { name: profiles, mountPath: /profiles, readOnly: true }
            {{- end }}
            {{- if .Values.dataProtection.existingClaim }}
            - { name: keys, mountPath: /keys }
            {{- end }}
            {{- if .Values.knowledge.existingClaim }}
            - { name: knowledge, mountPath: /knowledge, readOnly: true }
            {{- end }}
            {{- if .Values.gitops.enabled }}
            - { name: git, mountPath: /git, readOnly: true }
            {{- end }}
            {{- if .Values.audio.existingClaim }}
            - { name: audio, mountPath: /data/audio }
            {{- end }}
            {{- range $i, $s := .Values.secretFiles }}
            - { name: secret-file-{{ $i }}, mountPath: {{ $s.mountPath }}, readOnly: true }
            {{- end }}
        {{- if .Values.gitops.enabled }}
        - name: git-sync
          image: {{ .Values.gitops.image | quote }}
          securityContext: {{- include "lots.containerSecurityContext" . | nindent 12 }}
          env:
            - { name: GITSYNC_REPO, value: {{ required "gitops.repo is required when gitops.enabled" .Values.gitops.repo | quote }} }
            - { name: GITSYNC_REF, value: {{ .Values.gitops.ref | quote }} }
            - { name: GITSYNC_ROOT, value: /git }
            - { name: GITSYNC_LINK, value: current }
            - { name: GITSYNC_PERIOD, value: {{ .Values.gitops.period | quote }} }
            - { name: HOME, value: /tmp }
          {{- if .Values.gitops.credentialsSecret }}
          envFrom:
            - secretRef: { name: {{ .Values.gitops.credentialsSecret }} }
          {{- end }}
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: git, mountPath: /git }
            - { name: tmp, mountPath: /tmp }
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.gitops.enabled }}
        - name: git
          emptyDir: {}
        {{- end }}
        {{- if .Values.audio.existingClaim }}
        - name: audio
          persistentVolumeClaim:
            claimName: {{ .Values.audio.existingClaim }}
        {{- end }}
        {{- if .Values.profiles.files }}
        - name: profiles
          configMap:
            name: {{ include "lots.name" . }}-profiles
        {{- end }}
        {{- if .Values.dataProtection.existingClaim }}
        - name: keys
          persistentVolumeClaim:
            claimName: {{ .Values.dataProtection.existingClaim }}
        {{- end }}
        {{- if .Values.knowledge.existingClaim }}
        - name: knowledge
          persistentVolumeClaim:
            claimName: {{ .Values.knowledge.existingClaim }}
        {{- end }}
        {{- range $i, $s := .Values.secretFiles }}
        - name: secret-file-{{ $i }}
          secret:
            secretName: {{ $s.secretName }}
            defaultMode: 0440
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lots.name" . }}
  labels: {{- include "lots.labels" . | nindent 4 }}
spec:
  selector: {{- include "lots.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
