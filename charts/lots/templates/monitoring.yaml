{{- if .Values.metrics.serviceMonitor.enabled }}
# Prometheus Operator: scrape /metrics (no user identities in labels).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "lots.name" . }}
  labels: {{- include "lots.labels" . | nindent 4 }}{{- with .Values.metrics.serviceMonitor.labels }}{{ toYaml . | nindent 4 }}{{- end }}
spec:
  selector:
    matchLabels: {{- include "lots.selector" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
---
{{- end }}
{{- if .Values.metrics.grafanaDashboard }}
# Grafana sidecar picks this up (label grafana_dashboard: "1").
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lots.name" . }}-dashboard
  labels: {{- include "lots.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  lots.json: |-
{{ .Files.Get "dashboards/lots.json" | indent 4 }}
{{- end }}
