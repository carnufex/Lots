{{- if .Values.mcpToolpack.enabled }}
{{- $name := printf "%s-mcp-toolpack" (include "lots.name" .) }}
{{- if .Values.mcpToolpack.kubernetesReadOnly }}
# Read-only access for the kubernetes pack: no secrets, no configmaps, no write verbs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: {{- include "lots.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-read
  labels: {{- include "lots.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, events, persistentvolumeclaims, nodes, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-read
  labels: {{- include "lots.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $name }}-read }
subjects:
  - { kind: ServiceAccount, name: {{ $name }}, namespace: {{ .Release.Namespace }} }
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "lots.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lots-mcp-toolpack
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lots-mcp-toolpack
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.mcpToolpack.kubernetesReadOnly }}
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext: {{- include "lots.podSecurityContext" . | nindent 8 }}
      containers:
        - name: mcp
          image: "{{ .Values.mcpToolpack.image.repository }}:{{ .Values.mcpToolpack.image.tag | default .Chart.AppVersion }}"
          securityContext: {{- include "lots.containerSecurityContext" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: HOME, value: /tmp }
            {{- if .Values.otlpEndpoint }}
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.otlpEndpoint | quote }} }
            {{- end }}
            {{- if .Values.mcpToolpack.kubernetesReadOnly }}
            - { name: Kubernetes__InCluster, value: "true" }
            {{- end }}
            {{- range $k, $v := .Values.mcpToolpack.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
            {{- range .Values.mcpToolpack.secretEnv }}
            - name: {{ .name }}
              valueFrom: { secretKeyRef: { name: {{ .secretName }}, key: {{ .key }} } }
            {{- end }}
          readinessProbe:
            httpGet: { path: /health, port: http }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if .Values.mcpToolpack.filesClaim }}
            - { name: files, mountPath: /files, readOnly: true }
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.mcpToolpack.filesClaim }}
        - name: files
          persistentVolumeClaim: { claimName: {{ .Values.mcpToolpack.filesClaim }} }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "lots.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: lots-mcp-toolpack
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- end }}
