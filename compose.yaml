services:
  shell:
    build:
      context: .
      dockerfile: src/Lots.Shell/Dockerfile
    environment:
      Model__BaseUrl: ${LOTS_MODEL_URL:-http://host.docker.internal:11434/v1}
      Model__Model: ${LOTS_MODEL:-}
      Model__ApiKeyEnv: ${LOTS_MODEL_KEY_ENV:-}
      ConnectionStrings__Lots: Host=postgres;Database=lots;Username=lots;Password=${POSTGRES_PASSWORD:-lots-dev}
    ports:
      - "${LOTS_PORT:-8088}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: lots
      POSTGRES_USER: lots
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lots-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lots -d lots"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
