services:
  shell:
    build:
      context: .
      dockerfile: src/Lots.Shell/Dockerfile
    environment:
      Auth__Mode: ${LOTS_AUTH_MODE:-Dev}
      Auth__Oidc__Authority: ${LOTS_OIDC_AUTHORITY:-}
      Auth__Oidc__Audience: ${LOTS_OIDC_AUDIENCE:-}
      Model__BaseUrl: ${LOTS_MODEL_URL:-http://host.docker.internal:11434/v1}
      Model__Model: ${LOTS_MODEL:-}
      Model__ApiKeyEnv: ${LOTS_MODEL_KEY_ENV:-}
      ConnectionStrings__Lots: Host=postgres;Database=lots;Username=lots;Password=${POSTGRES_PASSWORD:-lots-dev}
    ports:
      - "${LOTS_PORT:-8088}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mcp-homelab:
        condition: service_started

  mcp-homelab:
    build:
      context: .
      dockerfile: src/Lots.Mcp.Homelab/Dockerfile
    environment:
      Docker__Url: http://docker-proxy:2375
    ports:
      - "127.0.0.1:${LOTS_MCP_PORT:-8089}:8080"
    depends_on:
      - docker-proxy

  # Read-only view of the Docker API: only container list/inspect/logs, no POST. The raw socket is never exposed.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: lots
      POSTGRES_USER: lots
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lots-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lots -d lots"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
