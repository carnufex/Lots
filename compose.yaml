services:
  shell:
    build:
      context: .
      dockerfile: src/Lots.Shell/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${LOTS_OTLP_ENDPOINT:-}   # http://otel-collector:4317 with --profile observability (#140)
      Telemetry__OtlpMetrics: "false"   # Prometheus scrapes /metrics; OTLP metrics would count twice
      # Local compose is a development stack: Dev auth and header identities are refused in any other environment (#87).
      ASPNETCORE_ENVIRONMENT: ${LOTS_ENVIRONMENT:-Development}
      Logging__Format: ${LOTS_LOG_FORMAT:-text}   # json = one JSON object per line, as in production (#138)
      Auth__Mode: ${LOTS_AUTH_MODE:-Dev}
      Auth__Oidc__Authority: ${LOTS_OIDC_AUTHORITY:-}
      Auth__Oidc__Audience: ${LOTS_OIDC_AUDIENCE:-}
      CMDB_AGENT_TOKEN: ${CMDB_AGENT_TOKEN:-}   # example of a secret a profile references via passwordEnv; set it in your shell or .env
      Profiles__Path: /profiles
      # Voice (ADR 0012): the voice service on the GPU PC; empty = voice off
      Auth__Dev__AllowHeaders: ${LOTS_DEV_HEADERS:-false}   # local development only: lets scripts act as other users via X-Dev-User
      Speech__BaseUrl: ${LOTS_VOICE_URL:-}
      Speech__ApiKeyEnv: LOTS_VOICE_KEY
      Speech__DefaultLanguage: ${LOTS_VOICE_DEFAULT_LANGUAGE:-auto}
      Speech__Vocabulary: ${LOTS_VOICE_VOCABULARY:-}
      Speech__Voices__sv: ${LOTS_VOICE_SV:-sv-nst}   # cb-default = the expressive voice (needs VOICE_CHATTERBOX=1 in the voice service)
      Speech__Voices__en: ${LOTS_VOICE_EN:-en-ljspeech}
      Speech__AudioPath: /data/audio   # conversation audio, encrypted, kept Speech__AudioRetentionDays (30, ADR 0014)
      DataProtection__KeysPath: /data/keys
      LOTS_VOICE_KEY: ${LOTS_VOICE_KEY:-}
      Model__BaseUrl: ${LOTS_MODEL_URL:-http://host.docker.internal:11434/v1}
      Model__Model: ${LOTS_MODEL:-}
      Model__ApiKeyEnv: ${LOTS_MODEL_KEY_ENV:-}
      # Knowledge (ADR 0016): embeddings on the same endpoint; the repo's docs are a sample source everyone may read
      Models__Aliases__embed__Targets__0__Endpoint: default
      Models__Aliases__embed__Targets__0__Model: ${LOTS_EMBED_MODEL:-nomic-embed-text}
      Knowledge__Sources__0__Id: lots-docs
      Knowledge__Sources__0__Name: Lots documentation
      Knowledge__Sources__0__Kind: directory
      Knowledge__Sources__0__Location: /knowledge/lots-docs
      Knowledge__Sources__0__Readers__0: "*"
      ConnectionStrings__Lots: Host=postgres;Database=lots;Username=lots;Password=${POSTGRES_PASSWORD:-lots-dev}
    volumes:
      - ${LOTS_PROFILES_DIR:-./profiles}:/profiles:ro
      - ${LOTS_KNOWLEDGE_DIR:-./docs}:/knowledge/lots-docs:ro
      - lots-data:/data
    ports:
      - "${LOTS_PORT:-8088}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mcp-homelab:
        condition: service_started

  mcp-homelab:
    build:
      context: .
      dockerfile: src/Lots.Mcp.Homelab/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${LOTS_OTLP_ENDPOINT:-}   # http://otel-collector:4317 with --profile observability (#140)
      Docker__Url: http://docker-proxy:2375
    ports:
      - "127.0.0.1:${LOTS_MCP_PORT:-8089}:8080"
    depends_on:
      - docker-proxy

  # Optional tool packs (#63): `docker compose --profile toolpack up`. Files = the repo's docs (read-only), fetch = allowlisted hosts.
  mcp-toolpack:
    profiles: [toolpack]
    build:
      context: .
      dockerfile: src/Lots.Mcp.Toolpack/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${LOTS_OTLP_ENDPOINT:-}   # http://otel-collector:4317 with --profile observability (#140)
      Files__Root: /files
      Fetch__AllowedHosts__0: ${LOTS_FETCH_HOST:-learn.microsoft.com}
    volumes:
      - ${LOTS_FILES_DIR:-./docs}:/files:ro
    ports:
      - "127.0.0.1:${LOTS_TOOLPACK_PORT:-8090}:8080"

  # Read-only view of the Docker API: only container list/inspect/logs, no POST. The raw socket is never exposed.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  postgres:
    image: pgvector/pgvector:0.8.1-pg17-trixie   # same glibc as postgres:17 (no collation mismatch); postgres:17 plus the vector extension (ADR 0016)
    environment:
      POSTGRES_DB: lots
      POSTGRES_USER: lots
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lots-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lots -d lots"]
      interval: 3s
      retries: 20

  # Default observability stack (#140), only with --profile observability:
  #   LOTS_OTLP_ENDPOINT=http://otel-collector:4317 docker compose --profile observability up -d
  # Grafana on http://localhost:3000 (anonymous viewer; admin/admin to edit), dashboards from deploy/grafana.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    profiles: [observability]
    command: ["--config=file:/etc/otelcol/config.yaml"]
    environment:
      LOTS_TRACE_SAMPLE_PERCENT: ${LOTS_TRACE_SAMPLE_PERCENT:-25}   # traces without errors, denials or slowness that are kept
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [tempo, loki]

  tempo:
    image: grafana/tempo:2.6.0
    profiles: [observability]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:3.2.0
    profiles: [observability]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./deploy/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [observability]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--enable-feature=exemplar-storage", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.2.2
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/lots-dashboard.json
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics
    volumes:
      - ./deploy/observability/grafana:/etc/grafana/provisioning/datasources:ro
      - ./deploy/observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/lots.yaml:ro
      - ./deploy/grafana:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${LOTS_GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus, tempo, loki]

volumes:
  lots-data:   # conversation audio and Data Protection keys
  pgdata:
  tempo-data:
  loki-data:
  prometheus-data:
