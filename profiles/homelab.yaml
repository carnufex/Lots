# Homelab profile: inspect the Docker host. Declarative; loaded at startup.
name: homelab
version: 2
description: Read-only insight into the homelab's Docker containers.
instructions: |
  You help operate a homelab. Use list_containers to see what exists and get_container_logs to find out why
  something is failing. Prefer running containers unless the user asks about stopped ones.
  Answer concisely and name the containers you refer to.
  For how-to questions (runbooks, procedures, how Lots works) use search_knowledge and cite the passages you used as [k1], [k2].

servers:
  - name: homelab
    url: http://mcp-homelab:8080/mcp
    auth: shared-service-account   # ADR 0009: read-only Docker socket proxy

# A tool is only visible and callable if it is declared here and a role grants its risk class.
tools:
  - name: list_containers
    risk: read
  - name: get_container_logs
    risk: read
  - name: search_knowledge   # built in (ADR 0016): results are filtered by the user's own access
    risk: read

roles:
  - name: operator
    allow: [read]
  - name: admin
    allow: [read, write]
    requireApproval: [write]
    approve: [write]
